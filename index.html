
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD NOW — The World, Live on One Map.</title>
<link rel="icon" type="image/png" href="world-now-emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="country-data.js"></script>
<script src="admin1-boundaries.js"></script>
<style>
  :root{
    --ink:#0b0f1a; --panel:#161f33; --amber:#e2a23d; --teal:#4f8f83;
    --paper:#f3ede1; --paper-dim:#c9c2b4; --line:#2a3450; --danger:#c96a4d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;overflow:hidden;}
  .intro-loader{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;
    background:var(--ink);opacity:1;visibility:visible;transition:opacity .42s ease,visibility .42s ease;}
  .intro-loader::before{content:"";position:absolute;inset:-20%;
    background:radial-gradient(circle at 50% 44%,rgba(226,162,61,.11),transparent 20%),
      radial-gradient(circle at 50% 50%,rgba(28,39,64,.42),transparent 48%);pointer-events:none;}
  .intro-loader.is-dismissing{opacity:0;visibility:hidden;pointer-events:none;}
  .intro-loader-inner{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;
    animation:introReveal .9s cubic-bezier(.2,.8,.25,1) both;}
  .intro-loader-video{display:block;width:100vw;height:100vh;max-width:none;max-height:none;object-fit:cover;
    filter:drop-shadow(0 0 18px rgba(226,162,61,.12));}
  .intro-emblem{position:absolute;left:50%;top:50%;z-index:1;pointer-events:none;width:min(30vw,280px);height:min(30vw,280px);object-fit:contain;transform:translate(-50%,-50%);filter:drop-shadow(0 0 18px rgba(226,162,61,.12));animation:introEmblemReveal 1.05s cubic-bezier(.2,.8,.25,1) .14s both;}
   .intro-wordmark-overlay{position:absolute;left:50%;top:50%;z-index:1;pointer-events:none;
    max-width:92vw;white-space:nowrap;transform:translate(-50%,calc(-50% + 5px));
    color:var(--paper);font-family:'Inter',sans-serif;font-size:clamp(2.1rem,10vw,7rem);
    font-weight:700;line-height:1;letter-spacing:.18em;text-shadow:0 2px 18px rgba(11,15,26,.72);
    clip-path:inset(0 100% 0 0);opacity:0;
    animation:introWordmarkReveal 1.05s cubic-bezier(.2,.8,.25,1) .14s forwards;}
  .intro-wordmark-overlay .amber{color:var(--amber);}
  .intro-wordmark-overlay::after{content:"";position:absolute;left:13%;right:7%;bottom:-16px;height:2px;
    background:linear-gradient(90deg,transparent,var(--amber) 22%,rgba(226,162,61,.9) 78%,transparent);
    transform:scaleX(0);transform-origin:left center;opacity:0;
    animation:introWordmarkSweep .55s cubic-bezier(.2,.8,.25,1) 1.05s forwards;}
  @keyframes introReveal{from{opacity:0;transform:translateY(8px) scale(.97);}to{opacity:1;transform:none;}}
  @keyframes introEmblemReveal{from{opacity:0;transform:translate(-50%,-50%) scale(.82);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
   @keyframes introWordmarkReveal{
    0%{clip-path:inset(0 100% 0 0);opacity:0;letter-spacing:.18em;transform:translate(-50%,calc(-50% + 5px));}
    22%{opacity:1;}
    72%{clip-path:inset(0 0 0 0);letter-spacing:.1em;transform:translate(-50%,calc(-50% + 1px));}
    100%{clip-path:inset(0 0 0 0);opacity:1;letter-spacing:.055em;transform:translate(-50%,-50%);}
  }
  @keyframes introWordmarkSweep{0%{transform:scaleX(0);opacity:0;}35%{opacity:.72;}100%{transform:scaleX(1);opacity:.72;}}
  @keyframes introWordmarkStatic{from{opacity:0;}to{opacity:1;}}
  .stage{position:relative;width:100%;height:100vh;}
  .stage::before{content:"";position:absolute;inset:0;
    background-image:radial-gradient(circle at 18% 22%, rgba(226,162,61,0.05), transparent 45%),
      radial-gradient(circle at 82% 78%, rgba(79,143,131,0.06), transparent 50%);
    pointer-events:none;}

  header.masthead{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
    padding:22px 32px 14px;z-index:5;pointer-events:none;}
  .brand-wordmark{display:block;width:64px;height:64px;object-fit:contain;}
  header.masthead h1{font-family:'Newsreader',serif;font-weight:700;font-size:28px;margin:0;letter-spacing:0.3px;color:var(--paper);}
  header.masthead .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--paper-dim);
    text-transform:uppercase;margin-top:4px;}
  header.masthead .clock{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--paper-dim);text-align:right;}
  header.masthead .clock .time{color:var(--amber);font-size:16px;letter-spacing:1px;}
  header.masthead .clock .tz{font-size:10px;opacity:.7;margin-top:2px;}

  /* search box */
  .search-wrap{position:absolute;top:90px;left:32px;z-index:6;}
  .search-wrap input{
    width:220px;background:var(--panel);border:1px solid var(--line);color:var(--paper);
    padding:9px 14px;border-radius:4px;font-family:'Inter',sans-serif;font-size:13px;outline:none;
    transition:border-color .15s ease;
  }
  .search-wrap input::placeholder{color:var(--paper-dim);}
  .search-wrap input:focus{border-color:var(--amber);}

  .hint{position:absolute;bottom:20px;left:32px;font-size:12px;color:var(--paper-dim);
    display:flex;align-items:center;gap:8px;z-index:5;}
  .hint .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  .source-flag{position:absolute;bottom:20px;right:32px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    letter-spacing:.5px;color:var(--paper-dim);opacity:.6;z-index:5;text-align:right;}

  svg#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;}
  svg#map:active{cursor:grabbing;}
  .country{fill:#1c2740;stroke:#0b0f1a;stroke-width:0.4;transition:fill .15s ease;cursor:pointer;}
  .country:hover{fill:var(--teal);}
  .country.selected{fill:var(--amber);}
  .internal-boundary{fill:none;stroke:rgba(201,194,180,0.34);stroke-width:0.24;vector-effect:non-scaling-stroke;pointer-events:none;}
  .country-outline{fill:none;stroke:#070a12;stroke-width:0.72;vector-effect:non-scaling-stroke;pointer-events:none;}

  #loadingMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;color:var(--paper-dim);font-size:13px;letter-spacing:1px;}

  .tooltip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);
    padding:6px 12px;border-radius:2px;font-size:13px;color:var(--paper);transform:translate(-50%,-130%);
    opacity:0;transition:opacity .1s ease;z-index:10;white-space:nowrap;font-family:'Inter',sans-serif;}
  .tooltip.show{opacity:1;}

  /* zoom controls */
  .zoom-controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;z-index:6;}
  .zoom-controls button{width:34px;height:34px;border-radius:4px;border:1px solid var(--line);
    background:var(--panel);color:var(--paper);font-size:16px;cursor:pointer;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:all .15s ease;font-family:'Inter',sans-serif;}
  .zoom-controls button:hover{border-color:var(--amber);color:var(--amber);}
  .zoom-controls button#zoomReset{font-size:11px;width:auto;padding:0 12px;font-family:'IBM Plex Mono',monospace;}

  /* world clock strip — tasteful use of the empty ocean space */
  .world-clock{
    position:absolute;top:100px;right:32px;z-index:5;
    background:rgba(22,31,51,0.55);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:6px;
    padding:12px 16px;display:flex;gap:18px;
  }
  .world-clock .city{text-align:center;}
  .world-clock .city .name{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--paper-dim);
    text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
  .world-clock .city .t{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--amber);}

  /* selected-country card — left side of the map */
  .country-card{
    position:absolute;top:150px;left:32px;width:196px;z-index:6;
    background:rgba(22,31,51,0.72);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:6px;padding:16px 16px 14px;
    opacity:0;transform:translateX(-14px);pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .country-card.show{opacity:1;transform:translateX(0);pointer-events:auto;}
  .country-card .cc-flag{font-size:34px;line-height:1;margin-bottom:8px;}
  .country-card .cc-flag img{width:44px;height:auto;border-radius:2px;box-shadow:0 0 0 1px var(--line);}
  .country-card .cc-name{font-family:'Newsreader',serif;font-weight:700;font-size:17px;color:var(--paper);
    margin-bottom:10px;line-height:1.2;}
  .country-card .cc-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:6px 0;border-top:1px solid var(--line);}
  .country-card .cc-row:first-of-type{border-top:none;}
  .country-card .cc-row .k{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--paper-dim);
    text-transform:uppercase;letter-spacing:1px;white-space:nowrap;}
  .country-card .cc-row .v{font-size:12.5px;color:var(--paper);text-align:right;}
  .country-card .cc-row .v.mono{font-family:'IBM Plex Mono',monospace;color:var(--amber);}

  /* mini-map — bottom-right overview */
  .mini-map-wrap{
    position:absolute;bottom:20px;right:32px;width:150px;height:150px;z-index:6;
    background:rgba(22,31,51,0.75);backdrop-filter:blur(6px);border:1px solid var(--line);
    border-radius:6px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,0.35);cursor:pointer;
    transition:width .2s ease, height .2s ease;
  }
  .mini-map-wrap svg{width:100%;height:100%;display:block;}
  .mini-map-wrap .mini-country{fill:#28324d;stroke:#0b0f1a;stroke-width:0.3;}
  .mini-map-wrap .mini-viewport{fill:rgba(226,162,61,0.16);stroke:var(--amber);stroke-width:1.6;}
  .mini-map-wrap .mini-toggle{position:absolute;top:3px;right:5px;font-family:'IBM Plex Mono',monospace;
    font-size:10px;color:var(--paper-dim);z-index:1;}
  .mini-map-wrap.collapsed{width:30px;height:30px;border-radius:50%;}
  .mini-map-wrap.collapsed svg{display:none;}
  .mini-map-wrap.collapsed .mini-toggle{display:none;}
  .mini-map-wrap.collapsed::after{content:"⛶";position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;color:var(--paper-dim);font-size:13px;}

  .wire-panel{position:absolute;top:0;right:0;height:100%;width:min(420px,92vw);background:var(--panel);
    border-right:1px solid var(--line);transform:translateX(105%);
    transition:transform .38s cubic-bezier(.2,.8,.25,1);z-index:20;display:flex;flex-direction:column;
    box-shadow:-24px 0 60px rgba(0,0,0,0.35);}
  .wire-panel.open{transform:translateX(0);}

  .wire-head{padding:26px 26px 16px;border-bottom:1px dashed var(--line);position:relative;}
  .wire-head .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--amber);
    text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
  .wire-head h2{font-family:'Newsreader',serif;font-weight:700;font-size:30px;margin:0 0 6px;color:var(--paper);line-height:1.15;}
  .wire-head .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--paper-dim);}
  .close-btn{position:absolute;top:22px;right:22px;background:none;border:1px solid var(--line);color:var(--paper-dim);
    width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:all .15s ease;}
  .close-btn:hover{border-color:var(--amber);color:var(--amber);}

  .fact-row{display:flex;flex-wrap:wrap;gap:10px 18px;padding:16px 0 4px;border-bottom:1px solid var(--line);margin-bottom:4px;}
  .fact-row .fact{min-width:80px;}
  .fact-row .fact .k{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:1px;}
  .fact-row .fact .v{font-size:13.5px;color:var(--paper);margin-top:2px;}

  .wire-body{flex:1;overflow-y:auto;padding:8px 26px 30px;}
  .wire-body::-webkit-scrollbar{width:6px;}
  .wire-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  .dispatch{padding:18px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start;}
  .dispatch:last-child{border-bottom:none;}
  .dispatch .num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--amber);padding-top:3px;min-width:22px;}
  .dispatch .body h3{margin:0 0 6px;font-size:16px;font-weight:600;color:var(--paper);line-height:1.4;}
  .dispatch .body p{margin:0 0 8px;font-size:13.5px;color:var(--paper-dim);line-height:1.6;font-weight:300;}
  .dispatch .body .src{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--teal);
    letter-spacing:.5px;text-transform:uppercase;}

  .ticker{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--paper-dim);
    display:flex;align-items:center;gap:10px;padding:24px 0;}
  /* WORLD NOW — offline global news tape */
  .global-news-tape{
    position:absolute;left:0;right:0;top:78px;z-index:8;height:34px;
    display:flex;align-items:center;overflow:hidden;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    background:rgba(11,15,26,.94);font-family:'IBM Plex Mono',monospace;
  }
  .global-news-label{
    flex:0 0 auto;height:100%;display:flex;align-items:center;
    padding:0 14px;color:var(--amber);font-size:10px;font-weight:600;
    letter-spacing:1.5px;border-right:1px solid var(--line);
    background:var(--navy);
  }
  .global-news-window{overflow:hidden;white-space:nowrap;flex:1;}
  .global-news-track{
    display:inline-flex;align-items:center;white-space:nowrap;
    will-change:transform;animation:globalNewsScroll 52s linear infinite;
  }
  .global-news-item{
    display:inline-flex;align-items:center;gap:9px;margin-right:54px;
    color:var(--paper-dim);font-size:10.5px;
  }
  .global-news-item .bullet{color:var(--amber);}
  .global-news-item .source{color:var(--teal);text-transform:uppercase;font-size:9px;}
  .global-news-window:hover .global-news-track{animation-play-state:paused;}
  @keyframes globalNewsScroll{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  @media (prefers-reduced-motion: reduce){
    .global-news-track{animation:none;}
  }
  .ticker .bars{display:flex;gap:3px;}
  .ticker .bar{width:3px;height:14px;background:var(--amber);animation:tick 1s infinite ease-in-out;}
  .ticker .bar:nth-child(2){animation-delay:.15s;}
  .ticker .bar:nth-child(3){animation-delay:.3s;}
  .ticker .bar:nth-child(4){animation-delay:.45s;}
  @keyframes tick{0%,100%{transform:scaleY(0.4);}50%{transform:scaleY(1);}}

  .share-btn{
    margin-top:14px;background:none;border:1px solid var(--line);color:var(--paper-dim);
    padding:7px 14px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:all .15s ease;
  }
  .share-btn:hover{border-color:var(--teal);color:var(--teal);}
  .share-btn.copied{border-color:var(--amber);color:var(--amber);}

  @media (prefers-reduced-motion: reduce){
    .intro-loader{transition:opacity .16s linear,visibility .16s linear;}
    .intro-loader-inner,.intro-globe-lines,.intro-globe-arc{animation:none;}
     .intro-emblem{animation:none;}
    .intro-wordmark-overlay{animation:introWordmarkStatic .16s ease both;clip-path:none;transform:translate(-50%,-50%);}
    .intro-wordmark-overlay::after{animation:none;transform:scaleX(1);opacity:.72;}
    .ticker .bar,.hint .dot{animation:none;}.wire-panel{transition:none;}
  }
  @media (max-width:640px){
    header.masthead{padding:16px 18px 10px;}
    .brand-wordmark{width:52px;height:52px;}
    .hint{display:none;}
    .source-flag{display:none;}
    .world-clock{display:none;}
    .country-card{display:none;}
    .mini-map-wrap{display:none;}
    .search-wrap{top:78px;left:18px;}
    .search-wrap input{width:150px;}
  }
</style>
</head>
<body>

<div class="intro-loader" id="introLoader" role="status" aria-label="WORLD NOW">
  <div class="intro-loader-inner">
    <video class="intro-loader-video" autoplay muted playsinline preload="auto"
      aria-label="WORLD NOW — The World, Live on One Map.">
      <source src="world-now-loader-light_1786639207704.mp4" type="video/mp4">
    </video>
    <img class="intro-emblem" src="./world-now-emblem.png" alt="WORLD NOW">
  </div>
</div>

<div class="stage">
  <header class="masthead">
    <img class="brand-wordmark" src="./world-now-emblem.png" alt="WORLD NOW — The World, Live on One Map.">
    <div class="clock">
      <div class="time" id="clockTime">--:--:--</div>
      <div class="tz" id="clockTz">detecting timezone…</div>
    </div>
  </header>

  <div class="global-news-tape" aria-label="WORLD NOW latest headlines">
    <div class="global-news-label">LIVE NEWS</div>
    <div class="global-news-window">
      <div class="global-news-track" id="globalNewsTrack"></div>
    </div>
  </div>

  <div class="search-wrap">
    <input type="text" id="searchInput" list="countryList" data-i18n-placeholder="searchPlaceholder" placeholder="Search a country…">
    <datalist id="countryList"></datalist>
  </div>

  <div class="world-clock" id="worldClock"></div>

  <svg id="map" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="loadingMsg" data-i18n="loadingMap">Loading map…</div>

  <div class="country-card" id="countryCard">
    <div class="cc-flag" id="ccFlag"></div>
    <div class="cc-name" id="ccName">—</div>
    <div class="cc-row"><span class="k" data-i18n="population">Population</span><span class="v" id="ccPopulation">—</span></div>
    <div class="cc-row"><span class="k" data-i18n="localTime">Local Time</span><span class="v mono" id="ccTime">—</span></div>
    <div class="cc-row"><span class="k" data-i18n="currency">Currency</span><span class="v" id="ccCurrency">—</span></div>
  </div>

  <div class="mini-map-wrap" id="miniMapWrap" title="Toggle overview map" role="button" tabindex="0" aria-label="Toggle overview map" aria-expanded="true">
    <span class="mini-toggle">＋</span>
    <svg id="miniMap" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="tooltip" id="tooltip"></div>
  <div class="hint"><span class="dot"></span><span data-i18n="hint">Click any country to see its news</span></div>
  <div class="source-flag" id="sourceFlag">Map: Natural Earth (50m) via world-atlas · ISC license<br>Country facts: local static dataset · News: local static feed · manually curated</div>

  <div class="zoom-controls">
    <button id="zoomOut" aria-label="Zoom out">−</button>
    <button id="zoomReset" data-i18n="reset">Reset</button>
    <button id="zoomIn" aria-label="Zoom in">+</button>
  </div>

  <aside class="wire-panel" id="panel">
    <div class="wire-head">
      <button class="close-btn" id="closeBtn" aria-label="Close">✕</button>
      <div class="eyebrow"><span data-i18n="dispatch">News Wire</span><span id="statusTag" data-i18n="statusDemo">— demo data —</span></div>
      <h2 id="panelTitle">—</h2>
      <div class="meta" id="panelMeta"></div>
      <div class="fact-row" id="factRow" style="display:none;"></div>
      <button class="share-btn" id="shareBtn">🔗 <span data-i18n="shareLink">Copy link to this country</span></button>
    </div>
    <div class="wire-body" id="panelBody"></div>
  </aside>
</div>

<script>
(function(){
  const loader = document.getElementById("introLoader");
  if(!loader) return;
  const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dismiss = () => {
    if(loader.dataset.dismissed) return;
    loader.dataset.dismissed = "true";
    loader.classList.add("is-dismissing");
    window.setTimeout(() => loader.remove(), reducedMotion ? 180 : 460);
  };
  const introVideo = loader.querySelector(".intro-loader-video");
  if(introVideo) introVideo.addEventListener("ended", dismiss, { once:true });
})();
</script>

<script>
(function(){
/* Guard: if the D3 / TopoJSON <script src> tags above failed to load
   (network block, ad-blocker, offline, CDN outage), every line below
   that touches d3.* would throw immediately and silently kill this
   entire script — header clock, search, map, everything — with no
   visible sign of why. Fail loudly and specifically instead. */
if (typeof d3 === "undefined" || typeof topojson === "undefined") {
  const loadingMsg = document.getElementById("loadingMsg");
  if (loadingMsg) {
    loadingMsg.textContent = "Could not load required map libraries (D3 / TopoJSON) from the CDN. Check your internet connection or any ad-blocker/script-blocker extension, then refresh the page.";
  }
  console.error("WORLD NOW: d3 or topojson failed to load from cdnjs — map cannot initialize.");
  return;
}

/* =========================================================================
   i18n dictionary — only "en" filled now; add more languages by adding keys.
   ========================================================================= */
const STRINGS = {
  en: {
    title: "WORLD NOW",
    subtitle: "The World, Live on One Map.",
    hint: "Click any country to see its news",
    loadingMap: "Loading map…",
    reset: "Reset",
    dispatch: "News Wire",
    statusDemo: "— demo data —",
    statusLoading: "— loading —",
    fetchingNews: "Preparing latest headlines…",
    demoSummary: "Demo headline for preview purposes — swap in a real news source later.",
    close: "Close",
    searchPlaceholder: "Search a country…",
    shareLink: "Copy link to this country",
    linkCopied: "Link copied!",
    capital: "Capital",
    population: "Population",
    region: "Region",
    localTime: "Local Time",
    currency: "Currency"
  }
};
let currentLang = "en";
// Declared here (before tickClock() runs below) because tickClock() calls
// tickCountryCardClock() immediately on script load, which reads this
// variable. Declaring it later with the other map state caused a
// "Cannot access before initialization" crash that killed the whole
// script before the map ever loaded.
let cardUtcOffsetMinutes = null; // minutes offset from UTC for the card's live clock
function t(key){ return (STRINGS[currentLang] && STRINGS[currentLang][key]) || key; }
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.getAttribute('data-i18n-placeholder')));
}
applyI18n();

/* =========================================================================
   Live local clock (visitor's own timezone) + small world-clock strip
   placed over the open ocean — a tasteful use of the map's empty space.
   ========================================================================= */
const clockTime = document.getElementById('clockTime');
const clockTz = document.getElementById('clockTz');
const visitorTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';

const WORLD_CITIES = [
  { name: "New York", tz: "America/New_York" },
  { name: "London", tz: "Europe/London" },
  { name: "Dubai", tz: "Asia/Dubai" },
  { name: "Tokyo", tz: "Asia/Tokyo" }
];
const worldClockEl = document.getElementById('worldClock');
worldClockEl.innerHTML = WORLD_CITIES.map(c => `
  <div class="city"><div class="name">${c.name}</div><div class="t" data-tz="${c.tz}">--:--</div></div>
`).join("");

function tickClock(){
  const now = new Date();
  clockTime.textContent = now.toLocaleTimeString('en-US', { hour12:false });
  clockTz.textContent = now.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }) + ' · ' + visitorTz;
  document.querySelectorAll('#worldClock [data-tz]').forEach(el => {
    el.textContent = now.toLocaleTimeString('en-US', { hour12:false, hour:'2-digit', minute:'2-digit', timeZone: el.dataset.tz });
  });
  tickCountryCardClock();
}
tickClock();
setInterval(tickClock, 1000);

/* =========================================================================
   Map — Natural Earth (public domain) via world-atlas (ISC), 50m resolution.
   D3 + topojson-client for rendering, d3-zoom for pan/zoom. All free, no keys.
   ========================================================================= */
const WORLD_ATLAS_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json";

const svg = d3.select("#map");
const mapGroup = svg.append("g");
const tooltip = document.getElementById("tooltip");
const panel = document.getElementById("panel");
const panelTitle = document.getElementById("panelTitle");
const panelMeta = document.getElementById("panelMeta");
const panelBody = document.getElementById("panelBody");
const factRow = document.getElementById("factRow");
const statusTag = document.getElementById("statusTag");
const stage = document.querySelector(".stage");
const searchInput = document.getElementById("searchInput");
const countryList = document.getElementById("countryList");
const shareBtn = document.getElementById("shareBtn");
const countryCard = document.getElementById("countryCard");
const ccFlag = document.getElementById("ccFlag");
const ccName = document.getElementById("ccName");
const ccPopulation = document.getElementById("ccPopulation");
const ccTime = document.getElementById("ccTime");
const ccCurrency = document.getElementById("ccCurrency");
const miniMapWrap = document.getElementById("miniMapWrap");
const miniSvg = d3.select("#miniMap");
const miniGroup = miniSvg.append("g");

let selectedNode = null;
let featuresByName = {};
let pathGen = null;
let miniViewportRect = null;
let internalBoundaryGroup = null;
let countryOutlineGroup = null;

// Bumped every time a country panel is opened or closed. Any in-flight
// fetch/timeout compares its captured token against the current value
// before touching the DOM, so a slow response from a country the user
// already clicked away from can never overwrite what's on screen
// (fixes stale data on rapid clicking / repeated open-close).
let openToken = 0;
// Caches local country facts per country name so re-selecting the same
// country reuses the same static record.
const factsCache = {};
// Caches generated demo-news headlines per country so reopening the same
// country reuses the already-computed set instead of recomputing it.
const newsCache = {};

const zoom = d3.zoom().scaleExtent([1, 8]).on("zoom", (event) => {
  mapGroup.attr("transform", event.transform);
  updateMiniViewport(event.transform);
});
svg.call(zoom);

document.getElementById("zoomIn").addEventListener("click", () => svg.transition().duration(250).call(zoom.scaleBy, 1.6));
document.getElementById("zoomOut").addEventListener("click", () => svg.transition().duration(250).call(zoom.scaleBy, 0.625));
document.getElementById("zoomReset").addEventListener("click", () => svg.transition().duration(350).call(zoom.transform, d3.zoomIdentity));

function zoomToFeature(feature){
  const [[x0,y0],[x1,y1]] = pathGen.bounds(feature);
  const dx = x1-x0, dy = y1-y0, cx=(x0+x1)/2, cy=(y0+y1)/2;
  const scale = Math.max(1, Math.min(8, 0.8 / Math.max(dx/960, dy/500)));
  const translate = [960/2 - scale*cx, 500/2 - scale*cy];
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale));
}

/* =========================================================================
   Mini-map — small overview in the bottom-right corner. Shares the same
   projection/pathGen as the main map, so it just redraws the same country
   silhouettes at a smaller scale and overlays a rectangle for the current
   viewport, kept in sync with the main map's zoom/pan transform.
   ========================================================================= */
function buildMiniMap(countries){
  miniGroup.selectAll("path")
    .data(countries.features)
    .join("path")
    .attr("class", "mini-country")
    .attr("d", pathGen);
  miniViewportRect = miniSvg.append("rect").attr("class", "mini-viewport");
  updateMiniViewport(d3.zoomIdentity);
}

function updateMiniViewport(transform){
  if(!miniViewportRect) return;
  const x = -transform.x / transform.k;
  const y = -transform.y / transform.k;
  const w = 960 / transform.k;
  const h = 500 / transform.k;
  miniViewportRect.attr("x", x).attr("y", y).attr("width", w).attr("height", h);
}

function toggleMiniMap(){
  const collapsed = miniMapWrap.classList.toggle("collapsed");
  miniMapWrap.setAttribute("aria-expanded", collapsed ? "false" : "true");
}
miniMapWrap.addEventListener("click", toggleMiniMap);
miniMapWrap.addEventListener("keydown", (e) => {
  if(e.key === "Enter" || e.key === " "){
    e.preventDefault();
    toggleMiniMap();
  }
});

function selectCountryByName(name, updateUrl){
  const feature = featuresByName[name];
  if(!feature) return;
  if(selectedNode) selectedNode.classList.remove("selected");
  const node = mapGroup.selectAll("path").filter(d => d === feature).node();
  if(node){ node.classList.add("selected"); selectedNode = node; }
  zoomToFeature(feature);
  openPanel(name);
  if(updateUrl !== false){
    const url = new URL(window.location);
    url.searchParams.set('country', name);
    history.replaceState(null, '', url);
  }
}

d3.json(WORLD_ATLAS_URL).then(world => {
  document.getElementById("loadingMsg").style.display = "none";
  const countries = topojson.feature(world, world.objects.countries);
  const projection = d3.geoNaturalEarth1().fitSize([960, 500], countries);
  pathGen = d3.geoPath(projection);

  countries.features.forEach(f => { featuresByName[f.properties.name] = f; });
  countryList.innerHTML = countries.features
    .map(f => f.properties.name).sort()
    .map(name => `<option value="${escapeHtml(name)}"></option>`).join("");

  mapGroup.selectAll("path")
    .data(countries.features)
    .join("path")
    .attr("class", "country")
    .attr("d", pathGen)
    .on("mousemove", (event, d) => {
      const [x, y] = d3.pointer(event, stage);
      tooltip.style.left = x + "px"; tooltip.style.top = y + "px";
      tooltip.textContent = d.properties.name; tooltip.classList.add("show");
    })
    .on("mouseleave", () => tooltip.classList.remove("show"))
    .on("click", (event, d) => selectCountryByName(d.properties.name));

  internalBoundaryGroup = mapGroup.append("g").attr("class", "internal-boundaries");
  const admin1 = window.ADMIN1_BOUNDARIES;
  if(admin1 && admin1.features && admin1.features.length){
    internalBoundaryGroup.selectAll("path")
      .data(admin1.features)
      .join("path")
      .attr("class", "internal-boundary")
      .attr("d", pathGen);
  }

  countryOutlineGroup = mapGroup.append("g").attr("class", "country-outlines");
  countryOutlineGroup.selectAll("path")
    .data(countries.features)
    .join("path")
    .attr("class", "country-outline")
    .attr("d", pathGen);

  buildMiniMap(countries);

  // deep link: ?country=Name
  const initial = new URL(window.location).searchParams.get('country');
  if(initial && featuresByName[initial]) selectCountryByName(initial, false);
}).catch((err) => {
  document.getElementById("loadingMsg").textContent = "Could not load map data from the CDN (world-atlas). Check your internet connection, then refresh the page.";
  console.error("WORLD NOW: failed to load world-atlas country data:", err);
});

searchInput.addEventListener("change", () => {
  const val = searchInput.value.trim();
  if(featuresByName[val]) selectCountryByName(val);
});
searchInput.addEventListener("keydown", (e) => {
  if(e.key === "Enter"){
    const val = searchInput.value.trim();
    if(featuresByName[val]) selectCountryByName(val);
  }
});

/* =========================================================================
   Country facts — local static data keyed by world-atlas country name.
   ========================================================================= */
function fetchCountryFacts(name, token){
  const c = factsCache[name] || window.COUNTRY_DATA[name];
  if(c) factsCache[name] = c;
  if(token !== openToken) return;
  if(!c){
    factRow.style.display = "none";
    countryCard.classList.remove("show");
    cardUtcOffsetMinutes = null;
    ccTime.textContent = "—";
    return;
  }
  factRow.innerHTML = `
    ${c.flag ? `<div class="fact"><div class="k">&nbsp;</div><div class="v" style="font-size:22px">${escapeHtml(c.flag)}</div></div>` : ""}
    ${c.capital ? `<div class="fact"><div class="k">${t('capital')}</div><div class="v">${escapeHtml(c.capital[0]||'—')}</div></div>` : ""}
    ${c.population ? `<div class="fact"><div class="k">${t('population')}</div><div class="v">${Number(c.population).toLocaleString('en-US')}</div></div>` : ""}
    ${c.region ? `<div class="fact"><div class="k">${t('region')}</div><div class="v">${escapeHtml(c.region)}</div></div>` : ""}
  `;
  factRow.style.display = "flex";
  updateCountryCard(name, c);
}

/* Selected-country card — left side of the map: flag, population,
   local time (derived from the country's UTC offset) and currency. */
function updateCountryCard(name, c){
  ccName.textContent = name;

  ccFlag.innerHTML = (c.flags && c.flags.svg && /^https:\/\//i.test(c.flags.svg))
    ? `<img src="${escapeHtml(c.flags.svg)}" alt="">`
    : (c.flag ? escapeHtml(c.flag) : "—");

  ccPopulation.textContent = c.population ? Number(c.population).toLocaleString('en-US') : "—";

  if(c.currencies){
    const [, info] = Object.entries(c.currencies)[0] || [];
    ccCurrency.textContent = info ? `${info.name}${info.symbol ? ' (' + info.symbol + ')' : ''}` : "—";
  }else{
    ccCurrency.textContent = "—";
  }

  cardUtcOffsetMinutes = (c.timezones && c.timezones[0]) ? parseUtcOffset(c.timezones[0]) : null;
  if(cardUtcOffsetMinutes === null) ccTime.textContent = "—";
  else tickCountryCardClock();

  countryCard.classList.add("show");
}

function parseUtcOffset(str){
  const m = /UTC([+-]\d{2}):(\d{2})/.exec(str || "");
  if(!m) return 0;
  const sign = m[1][0] === '-' ? -1 : 1;
  const hh = parseInt(m[1].slice(1), 10);
  const mm = parseInt(m[2], 10);
  return sign * (hh * 60 + mm);
}

function tickCountryCardClock(){
  if(cardUtcOffsetMinutes === null) return;
  const now = new Date();
  const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
  const local = new Date(utcMs + cardUtcOffsetMinutes * 60000);
  ccTime.textContent = local.toLocaleTimeString('en-US', { hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

/* =========================================================================
   Global moving news tape — local static database, no API required.
   Headlines are short paraphrases of recent world-news developments.
   ========================================================================= */
const GLOBAL_NEWS = [
  { title:"Oil spill reaches Oman's coast, raising major environmental concerns", source:"Reuters", time:"today" },
  { title:"Ukraine offers Russia a Black Sea truce proposal to protect civilian shipping", source:"Reuters", time:"today" },
  { title:"Global stocks rise as traders reduce expectations of a September Fed rate hike", source:"Reuters", time:"today" },
  { title:"Japan's wholesale inflation strengthens expectations for a possible rate increase", source:"Reuters", time:"today" },
  { title:"Russia-Ukraine attacks on grain shipping raise fresh global food-supply concerns", source:"Reuters", time:"today" },
  { title:"Rescue operations continue after a major earthquake in Colombia", source:"Reuters", time:"today" },
  { title:"Oil prices fall as global demand forecasts are revised lower", source:"Reuters", time:"today" },
  { title:"AI-related chip demand helps lift Asian technology shares", source:"Reuters", time:"today" },
  { title:"European countries and partners condemn Iran's executions of protesters", source:"Reuters", time:"yesterday" },
  { title:"Parts of Europe prepare for a rare total solar eclipse", source:"Reuters", time:"yesterday" }
];

function renderGlobalNewsTape(){
  const track = document.getElementById("globalNewsTrack");
  if(!track) return;
  const render = [...GLOBAL_NEWS, ...GLOBAL_NEWS].map(item => `
    <span class="global-news-item">
      <span class="bullet">●</span>
      <span>${escapeHtml(item.title)}</span>
      <span class="source">${escapeHtml(item.source)} · ${escapeHtml(item.time)}</span>
    </span>
  `).join("");
  track.innerHTML = render;
}
renderGlobalNewsTape();

/* =========================================================================
   Demo news generator — fully offline, no API calls, seeded per country.
   ========================================================================= */
const HEADLINE_TEMPLATES = [
  "Government in {country} announces new economic growth plan",
  "Peaceful protests in the capital call for administrative reform",
  "Major infrastructure project boosts regional connectivity in {country}",
  "{country}'s national team qualifies for the continental finals",
  "New local study shows improved air quality in major cities",
  "{country} signs bilateral energy cooperation agreement with neighbor",
  "Slight rise in food prices raises concerns among consumers",
  "International cultural festival opens, drawing visitors from abroad",
  "Digital education initiative launches for students in remote areas",
  "{country}'s central bank holds interest rates steady",
  "New public transit line eases congestion in the capital",
  "Report: foreign investment in {country} rises this quarter",
  "Local researchers announce new archaeological discovery",
  "Tourist arrivals to {country} climb during current season",
  "National environmental initiative targets carbon cuts by 2030"
];
const SOURCES = ["Local News Agency","Morning Herald","First News Channel","Economy Today","Global Outlook Magazine","Regional News Network","National Radio"];
const TIME_LABELS = ["1 hour ago","2 hours ago","3 hours ago","5 hours ago","8 hours ago","this morning","last night"];

function hashSeed(str){ let h=2166136261; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(seed){ return function(){ seed|=0; seed=(seed+0x6D2B79F5)|0; let t=Math.imul(seed^(seed>>>15),1|seed); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function shuffle(arr, rand){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function generateFakeNews(countryName){
  const rand = mulberry32(hashSeed(countryName));
  const templates = shuffle(HEADLINE_TEMPLATES, rand).slice(0, 6);
  const sources = shuffle(SOURCES, rand);
  const times = shuffle(TIME_LABELS, rand);
  return templates.map((tpl, i) => ({
    title: tpl.replace(/{country}/g, countryName),
    summary: t('demoSummary'),
    source: sources[i % sources.length],
    time: times[i % times.length]
  }));
}

function openPanel(countryName){
  openToken++;
  const myToken = openToken;

  panel.classList.add("open");
  panelTitle.textContent = countryName;
  panelMeta.textContent = new Date().toISOString().slice(0,16).replace('T',' · ') + " UTC";
  statusTag.textContent = t('statusLoading');
  factRow.style.display = "none";
  shareBtn.classList.remove("copied");
  shareBtn.querySelector('span').textContent = t('shareLink');
  panelBody.innerHTML = `
    <div class="ticker">
      <div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
      ${t('fetchingNews')}
    </div>`;

  fetchCountryFacts(countryName, myToken);

  setTimeout(() => {
    // If the user clicked another country (or closed the panel) before
    // this timeout fired, don't overwrite what's now on screen.
    if(myToken !== openToken) return;
    let items = newsCache[countryName];
    if(!items){
      items = generateFakeNews(countryName);
      newsCache[countryName] = items;
    }
    statusTag.textContent = t('statusDemo');
    panelBody.innerHTML = items.map((item, i) => `
      <div class="dispatch">
        <div class="num">${String(i+1).padStart(2,'0')}</div>
        <div class="body">
          <h3>${escapeHtml(item.title)}</h3>
          <p>${escapeHtml(item.summary)}</p>
          <div class="src">${escapeHtml(item.source)} · ${escapeHtml(item.time)}</div>
        </div>
      </div>
    `).join("");
  }, 450);
}

document.getElementById("closeBtn").addEventListener("click", () => {
  openToken++; // invalidate any in-flight fetch/timeout from the closed country
  panel.classList.remove("open");
  countryCard.classList.remove("show");
  cardUtcOffsetMinutes = null;
  if (selectedNode) selectedNode.classList.remove("selected");
  selectedNode = null;
  const url = new URL(window.location);
  url.searchParams.delete('country');
  history.replaceState(null, '', url);
});

shareBtn.addEventListener("click", async () => {
  try{
    await navigator.clipboard.writeText(window.location.href);
    shareBtn.classList.add("copied");
    shareBtn.querySelector('span').textContent = t('linkCopied');
    setTimeout(() => {
      shareBtn.classList.remove("copied");
      shareBtn.querySelector('span').textContent = t('shareLink');
    }, 1800);
  }catch(e){ /* clipboard unavailable — silently ignore */ }
});

document.addEventListener("keydown", (e) => {
  if(e.key === "Escape") document.getElementById("closeBtn").click();
});

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
})();
</script>
